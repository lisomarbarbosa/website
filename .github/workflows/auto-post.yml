name: Auto Generate Digital Law Article

on:
  schedule:
    # Artigo 1 — todos os dias às 08h UTC (05h Brasília)
    - cron: "0 8 * * *"
    # Artigo 2 — todos os dias às 14h UTC (11h Brasília)
    - cron: "0 14 * * *"

  workflow_dispatch:
    inputs:
      tema:
        description: "Tema personalizado para o artigo"
        required: false
        type: string
      modelo_ia:
        description: "Modelo OpenRouter (deixe vazio para usar cadeia de fallback automática)"
        required: false
        default: ""
        type: string
      artigo_slot:
        description: "Slot do artigo (1 ou 2)."
        required: false
        default: "1"
        type: string

permissions:
  contents: write


jobs:
  generate-legal-article:
    name: Generate and Validate Legal Article
    runs-on: ubuntu-latest
    # Timeout total do job: 6 horas (8 tentativas × 30 min + margem)
    timeout-minutes: 370

    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CUSTOM_TOPIC: ${{ inputs.tema }}
      CUSTOM_MODEL: ${{ inputs.modelo_ia != '' && inputs.modelo_ia || '' }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🔎 Validate environment
        run: |
          echo "🔎 Validando ambiente..."

          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "❌ OPENROUTER_API_KEY não configurada."
            exit 1
          fi

          if [ -z "$UNSPLASH_ACCESS_KEY" ]; then
            echo "⚠️ UNSPLASH_ACCESS_KEY não configurada."
            echo "O workflow continuará utilizando a imagem fallback."
          fi

          if [ ! -f "src/App.tsx" ]; then
            echo "❌ src/App.tsx não encontrado."
            exit 1
          fi

          if [ ! -f "public/sitemap.xml" ]; then
            echo "❌ public/sitemap.xml não encontrado."
            exit 1
          fi

          if [ ! -f "src/data/blog.ts" ]; then
            echo "❌ src/data/blog.ts não encontrado."
            exit 1
          fi

          echo "✅ Ambiente validado."

      - name: 🕐 Determinar slot do artigo
        id: slot_check
        run: |
          HOUR=$(date -u +"%H")
          TODAY=$(date -u +"%Y-%m-%d")

          # Determina o slot pelo horário ou pelo input manual
          if [ -n "${{ inputs.artigo_slot }}" ]; then
            SLOT="${{ inputs.artigo_slot }}"
          elif [ "$HOUR" -ge "8" ] && [ "$HOUR" -lt "14" ]; then
            SLOT="1"
          else
            SLOT="2"
          fi

          echo "📌 Slot detectado: $SLOT"
          echo "slot=$SLOT" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT

          # Extrai títulos já publicados hoje para evitar duplicidade de tema
          TITLES_TODAY=$(node -e "
            const fs = require('fs');
            const content = fs.readFileSync('src/data/blog.ts', 'utf8');
            const today = '$TODAY';
            const blocks = content.split(/(?=\s*\{)/);
            const titles = [];
            for (const block of blocks) {
              if (block.includes(\"date: '\" + today + \"'\")) {
                const m = block.match(/title:\s*'([^']+)'/);
                if (m) titles.push(m[1]);
              }
            }
            console.log(titles.join('|'));
          " 2>/dev/null || echo "")

          echo "📋 Temas já publicados hoje: $TITLES_TODAY"
          echo "used_topics=$TITLES_TODAY" >> $GITHUB_OUTPUT

      # ──────────────────────────────────────────────────────────────────────
      # LOOP DE RETRY: tenta gerar o artigo até MAX_ATTEMPTS vezes.
      # Entre cada falha, aguarda WAIT_SECONDS (30 minutos) antes de tentar
      # novamente. O loop sai imediatamente ao primeiro sucesso.
      # ──────────────────────────────────────────────────────────────────────
      - name: 🤖 Generate article (retry a cada 30 min até ter sucesso)
        if: steps.slot_check.outputs.skip != 'true'
        id: generate
        env:
          ARTICLE_SLOT: ${{ steps.slot_check.outputs.slot }}
          ARTICLE_USED_TOPICS: ${{ steps.slot_check.outputs.used_topics }}
        run: |
          MAX_ATTEMPTS=8        # máximo de tentativas (8 × 30 min = 4 horas)
          WAIT_SECONDS=1800     # 30 minutos entre tentativas
          ATTEMPT=0
          SUCCESS=false

          while [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔄 Tentativa $ATTEMPT de $MAX_ATTEMPTS — $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # Executa o script de geração
            if node .github/scripts/generate-post.js; then
              echo ""
              echo "✅ Artigo gerado com sucesso na tentativa $ATTEMPT!"
              SUCCESS=true
              break
            else
              EXIT_CODE=$?
              echo ""
              echo "❌ Tentativa $ATTEMPT falhou (exit code: $EXIT_CODE)."

              if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
                WAIT_MIN=$((WAIT_SECONDS / 60))
                echo "⏳ Aguardando $WAIT_MIN minutos antes da próxima tentativa..."
                echo "   Próxima tentativa: $(date -u -d "+${WAIT_SECONDS} seconds" '+%H:%M:%S UTC' 2>/dev/null || date -u -v +${WAIT_SECONDS}S '+%H:%M:%S UTC')"
                sleep "$WAIT_SECONDS"

                # Atualiza o repositório antes de cada nova tentativa para
                # garantir que o blog.ts esteja sincronizado
                git pull --rebase origin main || true
              else
                echo "🚨 Todas as $MAX_ATTEMPTS tentativas falharam."
                echo "   O artigo não pôde ser criado automaticamente."
                echo "   Verifique os logs acima para identificar a causa."
                exit 1
              fi
            fi
          done

          if [ "$SUCCESS" != "true" ]; then
            exit 1
          fi

      - name: 🔍 Validate generated files
        if: steps.slot_check.outputs.skip != 'true'
        run: |
          echo "🔍 Verificando alterações em src/data/blog.ts e public/sitemap.xml..."

          BLOG_CHANGED=$(git status --porcelain | grep 'src/data/blog.ts' | wc -l)
          SITEMAP_CHANGED=$(git status --porcelain | grep 'public/sitemap.xml' | wc -l)

          if [ "$BLOG_CHANGED" -eq "0" ]; then
            if [ -f ".generated_slug" ]; then
              GENERATED_SLUG=$(cat .generated_slug)
              SLUG_EXISTS=$(grep -c "slug: '$GENERATED_SLUG'" src/data/blog.ts 2>/dev/null || echo "0")
              if [ "$SLUG_EXISTS" -gt "0" ]; then
                echo "⚠️ Slug '$GENERATED_SLUG' já existia no blog.ts — deduplicação correta, nada a fazer."
                echo "skip_commit=true" >> $GITHUB_ENV
              else
                echo "❌ src/data/blog.ts não foi modificado e o slug não foi encontrado. O post não foi gravado."
                exit 1
              fi
            else
              echo "❌ src/data/blog.ts não foi modificado. O post não foi gravado."
              exit 1
            fi
          else
            echo "skip_commit=false" >> $GITHUB_ENV
          fi

          if [ "$SITEMAP_CHANGED" -eq "0" ] && [ "${skip_commit:-false}" != "true" ]; then
            echo "⚠️ public/sitemap.xml não foi modificado."
          fi

          echo "✅ Validação concluída."

      - name: 🔍 Auditoria de integridade do artigo
        if: steps.slot_check.outputs.skip != 'true' && env.skip_commit != 'true'
        run: |
          echo "🔍 Iniciando auditoria de integridade do artigo gerado..."
          ERRORS=0

          # Localiza o arquivo .ts gerado mais recente em src/content/blog/
          ARTICLE_FILE=$(git diff --name-only --diff-filter=A -- 'src/content/blog/*.ts' | head -1)

          if [ -z "$ARTICLE_FILE" ]; then
            # Fallback: arquivo modificado mais recente
            ARTICLE_FILE=$(git diff --name-only -- 'src/content/blog/*.ts' | head -1)
          fi

          if [ -z "$ARTICLE_FILE" ]; then
            # Segundo fallback: usa o slug gerado para localizar o arquivo diretamente
            if [ -f ".generated_slug" ]; then
              GENERATED_SLUG=$(cat .generated_slug)
              ARTICLE_FILE="src/content/blog/${GENERATED_SLUG}.ts"
              echo "🔎 Usando slug gerado para localizar: $ARTICLE_FILE"
            fi
          fi

          if [ -z "$ARTICLE_FILE" ] || [ ! -f "$ARTICLE_FILE" ]; then
            echo "⚠️ Nenhum arquivo .ts encontrado em src/content/blog/ neste commit."
            echo "   Pulando auditoria de integridade."
            exit 0
          fi

          echo "📄 Arquivo auditado: $ARTICLE_FILE"
          echo "---"

          # 1. slug — campo obrigatório no objeto de conteúdo
          if grep -q "slug:" "$ARTICLE_FILE"; then
            echo "✅ slug: presente"
          else
            echo "❌ slug: AUSENTE"
            ERRORS=$((ERRORS+1))
          fi

          # 2. title
          if grep -q "title:" "$ARTICLE_FILE"; then
            echo "✅ title: presente"
          else
            echo "❌ title: AUSENTE"
            ERRORS=$((ERRORS+1))
          fi

          # 3. description / excerpt
          if grep -qE "(description|excerpt):" "$ARTICLE_FILE"; then
            echo "✅ description/excerpt: presente"
          else
            echo "❌ description/excerpt: AUSENTE"
            ERRORS=$((ERRORS+1))
          fi

          # 4. image
          if grep -q "image:" "$ARTICLE_FILE"; then
            echo "✅ image: presente"
          else
            echo "❌ image: AUSENTE"
            ERRORS=$((ERRORS+1))
          fi

          # 5. date
          if grep -q "date:" "$ARTICLE_FILE"; then
            echo "✅ date: presente"
          else
            echo "❌ date: AUSENTE"
            ERRORS=$((ERRORS+1))
          fi

          # 6. content / body — campo com o HTML/JSX do artigo
          if grep -qE "(content|body):" "$ARTICLE_FILE"; then
            echo "✅ content/body: presente"
          else
            echo "❌ content/body: AUSENTE — artigo sem conteúdo renderizável"
            ERRORS=$((ERRORS+1))
          fi

          # 7. export default
          if grep -q "export default" "$ARTICLE_FILE"; then
            echo "✅ export default: presente"
          else
            echo "❌ export default: AUSENTE — módulo não será importável"
            ERRORS=$((ERRORS+1))
          fi

          # 8. CTA final obrigatório — bloco Fale Conosco
          if grep -q "Fale Conosco" "$ARTICLE_FILE"; then
            echo "✅ CTA final (Fale Conosco): presente"
          else
            echo "❌ CTA final (Fale Conosco): AUSENTE — artigo sem chamada para ação"
            ERRORS=$((ERRORS+1))
          fi

          # 9. Disclaimer legal
          if grep -q "caráter informativo" "$ARTICLE_FILE"; then
            echo "✅ Disclaimer legal: presente"
          else
            echo "❌ Disclaimer legal: AUSENTE — obrigatório em todos os artigos"
            ERRORS=$((ERRORS+1))
          fi

          # 10. Categoria Direito Digital
          if grep -q "Direito Digital" "$ARTICLE_FILE"; then
            echo "✅ Categoria (Direito Digital): presente"
          else
            echo "❌ Categoria (Direito Digital): AUSENTE"
            ERRORS=$((ERRORS+1))
          fi

          echo "---"

          if [ "$ERRORS" -gt "0" ]; then
            echo "🚨 Auditoria de integridade FALHOU com $ERRORS erro(s)."
            echo "   Commit abortado. Corrija os problemas acima no script de geração."
            exit 1
          else
            echo "🎉 Auditoria de integridade APROVADA — todos os campos obrigatórios presentes."
          fi

      - name: 🧹 Fix trailing whitespace
        if: steps.slot_check.outputs.skip != 'true' && env.skip_commit != 'true'
        run: |
          sed -i 's/[[:space:]]*$//' src/data/blog.ts
          sed -i 's/[[:space:]]*$//' public/sitemap.xml
          # Aplica também aos arquivos de conteúdo gerados
          if [ -f ".generated_slug" ]; then
            GENERATED_SLUG=$(cat .generated_slug)
            CONTENT_FILE="src/content/blog/${GENERATED_SLUG}.ts"
            if [ -f "$CONTENT_FILE" ]; then
              sed -i 's/[[:space:]]*$//' "$CONTENT_FILE"
            fi
            TSX_FILE="src/pages/artigos/${GENERATED_SLUG}.tsx"
            if [ -f "$TSX_FILE" ]; then
              sed -i 's/[[:space:]]*$//' "$TSX_FILE"
            fi
          fi
          echo "✅ Trailing whitespace removido."

      - name: 📝 Show generated changes
        if: steps.slot_check.outputs.skip != 'true' && env.skip_commit != 'true'
        run: |
          echo "📝 Novos arquivos e alterações:"
          git status --short

          echo ""
          echo "📋 Alterações em src/data/blog.ts (primeiras 60 linhas do diff):"
          git diff -- src/data/blog.ts | head -60

          echo ""
          echo "📄 Arquivos gerados em src/content/blog/:"
          git diff --name-only --diff-filter=A -- 'src/content/blog/*.ts' || true

          echo ""
          echo "📄 Arquivos gerados em src/pages/artigos/:"
          git diff --name-only --diff-filter=A -- 'src/pages/artigos/*.tsx' || true

          echo ""
          echo "🗺️ Alterações em sitemap.xml:"
          git diff --stat -- public/sitemap.xml

      - name: 🚀 Commit and push
        if: steps.slot_check.outputs.skip != 'true' && env.skip_commit != 'true'
        run: |
          set -e

          TODAY=$(date -u +"%Y-%m-%d")
          SLOT="${{ steps.slot_check.outputs.slot }}"

          TITLE=$(node -e "
          const fs = require('fs');
          const content = fs.readFileSync('src/data/blog.ts', 'utf8');
          const match = content.match(/title:\s*'([^']+)'/);
          console.log(match ? match[1].trim() : 'novo artigo de direito digital');
          ")

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Adiciona todos os arquivos gerados/modificados pelo script
          git add src/data/blog.ts
          git add src/content/blog/
          git add public/sitemap.xml
          git add src/pages/artigos/ || true
          git add src/App.tsx || true

          git commit -m "bot: [slot ${SLOT}] ${TITLE} ${TODAY}"

          git pull --rebase origin main

          git push origin main

          echo "🚀 Artigo slot ${SLOT} publicado no branch main."

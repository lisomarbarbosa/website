name: Auto Generate Digital Law Article

on:
  schedule:
    # Artigo 1 — todos os dias às 08h UTC (05h Brasília)
    - cron: "0 8 * * *"
    # Artigo 2 — todos os dias às 14h UTC (11h Brasília)
    - cron: "0 14 * * *"

  workflow_dispatch:
    inputs:
      tema:
        description: "Tema personalizado para o artigo"
        required: false
        type: string
      modelo_ia:
        description: "Modelo OpenRouter (deixe vazio para usar cadeia de fallback automática)"
        required: false
        default: ""
        type: string
      artigo_slot:
        description: "Slot do artigo (1 ou 2). Slot 2 só publica se slot 1 já existir hoje."
        required: false
        default: "1"
        type: string

permissions:
  contents: write

jobs:
  generate-legal-article:
    name: Generate and Validate Legal Article
    runs-on: ubuntu-latest

    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CUSTOM_TOPIC: ${{ inputs.tema }}
      CUSTOM_MODEL: ${{ inputs.modelo_ia != '' && inputs.modelo_ia || '' }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🔎 Validate environment
        run: |
          echo "🔎 Validando ambiente..."

          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "❌ OPENROUTER_API_KEY não configurada."
            exit 1
          fi

          if [ -z "$UNSPLASH_ACCESS_KEY" ]; then
            echo "⚠️ UNSPLASH_ACCESS_KEY não configurada."
            echo "O workflow continuará utilizando a imagem fallback."
          fi

          if [ ! -f "src/App.tsx" ]; then
            echo "❌ src/App.tsx não encontrado."
            exit 1
          fi

          if [ ! -f "public/sitemap.xml" ]; then
            echo "❌ public/sitemap.xml não encontrado."
            exit 1
          fi

          if [ ! -f "src/data/blog.ts" ]; then
            echo "❌ src/data/blog.ts não encontrado."
            exit 1
          fi

          echo "✅ Ambiente validado."

      - name: 🕐 Verificar slot e condição de publicação
        id: slot_check
        run: |
          HOUR=$(date -u +"%H")
          TODAY=$(date -u +"%Y-%m-%d")

          # Determina o slot pelo horário ou pelo input manual
          if [ -n "${{ inputs.artigo_slot }}" ]; then
            SLOT="${{ inputs.artigo_slot }}"
          elif [ "$HOUR" -ge "8" ] && [ "$HOUR" -lt "14" ]; then
            SLOT="1"
          else
            SLOT="2"
          fi

          echo "📌 Slot detectado: $SLOT"
          echo "slot=$SLOT" >> $GITHUB_OUTPUT

          # Se for slot 2, verifica se já existe um post publicado hoje
          if [ "$SLOT" = "2" ]; then
            POSTS_TODAY=$(grep -c "date: '$TODAY'" src/data/blog.ts 2>/dev/null || echo "0")
            echo "📊 Posts publicados hoje ($TODAY): $POSTS_TODAY"

            if [ "$POSTS_TODAY" -eq "0" ]; then
              echo "⏭️ Slot 2 ignorado: nenhum artigo publicado hoje ainda."
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "used_topics=" >> $GITHUB_OUTPUT
            else
              echo "✅ Slot 2 liberado: $POSTS_TODAY post(s) publicado(s) hoje."
              echo "skip=false" >> $GITHUB_OUTPUT

              # Extrai os títulos dos posts publicados hoje para repassar ao script
              TITLES_TODAY=$(node -e "
                const fs = require('fs');
                const content = fs.readFileSync('src/data/blog.ts', 'utf8');
                const today = '$TODAY';
                const blocks = content.split(/(?=\s*\{)/);
                const titles = [];
                for (const block of blocks) {
                  if (block.includes(\"date: '\" + today + \"'\")) {
                    const m = block.match(/title:\s*'([^']+)'/);
                    if (m) titles.push(m[1]);
                  }
                }
                console.log(titles.join('|'));
              " 2>/dev/null || echo "")

              echo "📋 Temas já publicados hoje: $TITLES_TODAY"
              echo "used_topics=$TITLES_TODAY" >> $GITHUB_OUTPUT
            fi
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "used_topics=" >> $GITHUB_OUTPUT
          fi

      - name: 🤖 Generate, research and audit article (com loop de reescrita)
        if: steps.slot_check.outputs.skip != 'true'
        id: generate
        env:
          ARTICLE_SLOT: ${{ steps.slot_check.outputs.slot }}
          ARTICLE_USED_TOPICS: ${{ steps.slot_check.outputs.used_topics }}
        run: |
          node .github/scripts/generate-post.js

      - name: 🔍 Validate generated files
        if: steps.slot_check.outputs.skip != 'true'
        run: |
          echo "🔍 Verificando alterações em src/data/blog.ts e public/sitemap.xml..."

          BLOG_CHANGED=$(git status --porcelain | grep 'src/data/blog.ts' | wc -l)
          SITEMAP_CHANGED=$(git status --porcelain | grep 'public/sitemap.xml' | wc -l)

          if [ "$BLOG_CHANGED" -eq "0" ]; then
            if [ -f ".generated_slug" ]; then
              GENERATED_SLUG=$(cat .generated_slug)
              SLUG_EXISTS=$(grep -c "slug: '$GENERATED_SLUG'" src/data/blog.ts 2>/dev/null || echo "0")
              if [ "$SLUG_EXISTS" -gt "0" ]; then
                echo "⚠️ Slug '$GENERATED_SLUG' já existia no blog.ts — deduplicação correta, nada a fazer."
                echo "skip_commit=true" >> $GITHUB_ENV
              else
                echo "❌ src/data/blog.ts não foi modificado e o slug não foi encontrado. O post não foi gravado."
                exit 1
              fi
            else
              echo "❌ src/data/blog.ts não foi modificado. O post não foi gravado."
              exit 1
            fi
          else
            echo "skip_commit=false" >> $GITHUB_ENV
          fi

          if [ "$SITEMAP_CHANGED" -eq "0" ] && [ "${skip_commit:-false}" != "true" ]; then
            echo "⚠️ public/sitemap.xml não foi modificado."
          fi

          echo "✅ Validação concluída."

      - name: 🔍 Auditoria de integridade do artigo
        if: steps.slot_check.outputs.skip != 'true' && env.skip_commit != 'true'
        run: |
          echo "🔍 Iniciando auditoria de integridade do artigo gerado..."
          ERRORS=0

          # Localiza o arquivo .tsx gerado mais recente em src/pages/articles/
          ARTICLE_FILE=$(git diff --name-only --diff-filter=A -- 'src/pages/articles/*.tsx' | head -1)

          if [ -z "$ARTICLE_FILE" ]; then
            # Fallback: arquivo modificado mais recente
            ARTICLE_FILE=$(git diff --name-only -- 'src/pages/articles/*.tsx' | head -1)
          fi

          if [ -z "$ARTICLE_FILE" ]; then
            echo "⚠️ Nenhum arquivo .tsx encontrado em src/pages/articles/ neste commit."
            echo "   Pulando auditoria de integridade."
            exit 0
          fi

          echo "📄 Arquivo auditado: $ARTICLE_FILE"
          echo "---"

          # 1. canonical
          if grep -q 'rel="canonical"' "$ARTICLE_FILE"; then
            echo "✅ canonical: presente"
          else
            echo "❌ canonical: AUSENTE"
            ERRORS=$((ERRORS+1))
          fi

          # 2. og:title
          if grep -q 'property="og:title"' "$ARTICLE_FILE"; then
            echo "✅ og:title: presente"
          else
            echo "❌ og:title: AUSENTE"
            ERRORS=$((ERRORS+1))
          fi

          # 3. og:description
          if grep -q 'property="og:description"' "$ARTICLE_FILE"; then
            echo "✅ og:description: presente"
          else
            echo "❌ og:description: AUSENTE"
            ERRORS=$((ERRORS+1))
          fi

          # 4. og:image
          if grep -q 'property="og:image"' "$ARTICLE_FILE"; then
            echo "✅ og:image: presente"
          else
            echo "❌ og:image: AUSENTE"
            ERRORS=$((ERRORS+1))
          fi

          # 5. twitter:card
          if grep -q 'name="twitter:card"' "$ARTICLE_FILE"; then
            echo "✅ twitter:card: presente"
          else
            echo "❌ twitter:card: AUSENTE"
            ERRORS=$((ERRORS+1))
          fi

          # 6. export default
          if grep -q 'export default' "$ARTICLE_FILE"; then
            echo "✅ export default: presente"
          else
            echo "❌ export default: AUSENTE — componente não será importável pelo React Router"
            ERRORS=$((ERRORS+1))
          fi

          # 7. window.scrollTo
          if grep -q 'window.scrollTo' "$ARTICLE_FILE"; then
            echo "✅ window.scrollTo: presente"
          else
            echo "❌ window.scrollTo: AUSENTE — página não volta ao topo ao navegar"
            ERRORS=$((ERRORS+1))
          fi

          echo "---"

          if [ "$ERRORS" -gt "0" ]; then
            echo "🚨 Auditoria de integridade FALHOU com $ERRORS erro(s)."
            echo "   Commit abortado. Corrija os problemas acima no script de geração."
            exit 1
          else
            echo "🎉 Auditoria de integridade APROVADA — todos os 7 campos obrigatórios presentes."
          fi

      - name: 🧹 Fix trailing whitespace
        if: steps.slot_check.outputs.skip != 'true' && env.skip_commit != 'true'
        run: |
          sed -i 's/[[:space:]]*$//' src/data/blog.ts
          sed -i 's/[[:space:]]*$//' public/sitemap.xml
          echo "✅ Trailing whitespace removido."

      - name: 📝 Show generated changes
        if: steps.slot_check.outputs.skip != 'true' && env.skip_commit != 'true'
        run: |
          echo "📝 Novos arquivos e alterações:"
          git status --short

          echo ""
          echo "📋 Alterações em src/data/blog.ts (primeiras 60 linhas do diff):"
          git diff -- src/data/blog.ts | head -60

          echo ""
          echo "🗺️ Alterações em sitemap.xml:"
          git diff --stat -- public/sitemap.xml

      - name: 🚀 Commit and push
        if: steps.slot_check.outputs.skip != 'true' && env.skip_commit != 'true'
        run: |
          set -e

          TODAY=$(date -u +"%Y-%m-%d")
          SLOT="${{ steps.slot_check.outputs.slot }}"

          TITLE=$(node -e "
          const fs = require('fs');
          const content = fs.readFileSync('src/data/blog.ts', 'utf8');
          const match = content.match(/title:\s*'([^']+)'/);
          console.log(match ? match[1].trim() : 'novo artigo de direito digital');
          ")

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add src/data/blog.ts public/sitemap.xml src/pages/articles/ src/App.tsx

          git commit -m "bot: [slot ${SLOT}] ${TITLE} ${TODAY}"

          git pull --rebase origin main

          git push origin main

          echo "🚀 Artigo slot ${SLOT} publicado no branch main."

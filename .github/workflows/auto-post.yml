name: Auto Generate Digital Law Article

on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 14 * * *"

  workflow_dispatch:
    inputs:
      tema:
        description: "Tema personalizado"
        required: false
        type: string
      modelo_ia:
        description: "Modelo OpenRouter"
        required: false
        default: ""
        type: string
      artigo_slot:
        description: "Slot (1 ou 2)"
        required: false
        default: "1"
        type: string

permissions:
  contents: write

jobs:
  generate-legal-article:
    name: Generate Article
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CUSTOM_TOPIC: ${{ inputs.tema }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate environment
        run: |
          set -e
          [ -z "$OPENROUTER_API_KEY" ] && { echo "❌ OPENROUTER_API_KEY missing"; exit 1; }
          [ ! -f "src/data/blog.ts" ] && { echo "❌ src/data/blog.ts missing"; exit 1; }
          [ ! -f "public/sitemap.xml" ] && { echo "❌ sitemap.xml missing"; exit 1; }
          [ ! -f "src/app/artigos/page.tsx" ] && { echo "❌ artigos/page.tsx missing"; exit 1; }
          [ ! -f "src/app/artigos/[slug]/page.tsx" ] && { echo "❌ [slug]/page.tsx missing"; exit 1; }
          echo "✅ Next.js validated"
      - name: Slot check
        id: slot_check
        run: |
          HOUR=$(date -u +"%H")
          TODAY=$(date -u +"%Y-%m-%d")
          if [ -n "${{ inputs.artigo_slot }}" ]; then
            SLOT="${{ inputs.artigo_slot }}"
          elif [ "$HOUR" -ge "8" ] && [ "$HOUR" -lt "14" ]; then
            SLOT="1"
          else
            SLOT="2"
          fi
          echo "slot=$SLOT" >> $GITHUB_OUTPUT
          if [ "$SLOT" = "2" ]; then
            POSTS_TODAY=$(grep -c "date: '$TODAY'" src/data/blog.ts 2>/dev/null || echo "0")
            [ "$POSTS_TODAY" -eq "0" ] && { echo "skip=true" >> $GITHUB_OUTPUT; exit 0; }
          fi
          echo "skip=false" >> $GITHUB_OUTPUT
      - name: Generate article
        if: steps.slot_check.outputs.skip != 'true'
        run: node .github/scripts/generate-post.js
      - name: Update sitemap
        if: steps.slot_check.outputs.skip != 'true'
        run: node .github/scripts/update-sitemap.js
      - name: Commit and push
        if: steps.slot_check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/blog.ts src/content/blog/ public/sitemap.xml
          TODAY=$(date -u +"%Y-%m-%d")
          TITLE=$(node -e "const fs=require('fs');const c=fs.readFileSync('src/data/blog.ts','utf8');const m=c.match(/title:\s*'([^']+)'/);console.log(m?m[1].trim():'novo artigo')")
          git commit -m "bot: [slot ${{ steps.slot_check.outputs.slot }}] $TITLE $TODAY"
          git pull --rebase origin main
          git push origin main
